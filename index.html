<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#244B70">
<meta name="description" content="مُذاكرتي: تطبيق تفاعلي يوجّه طالبات المرحلة المتوسطة إلى خطوات مذاكرة مناسبة لكل مادة.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📘%3C/text%3E%3C/svg%3E">
<title>مُذاكرتي | مذاكرة أسهل وفهم أفضل</title>
<style>
:root{--bg:#F4F7FB;--navy:#244B70;--light:#DCE7F3;--line:#DDE5EE;--muted:#5F6F80;--ok:#2E8B57}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#1F2D3D;font-family:Tahoma,Arial,sans-serif}
header{background:var(--navy);color:#fff;text-align:center;padding:22px 16px}header h1{font-size:25px;margin:0}header p{color:var(--light);margin:6px 0 0;font-size:15px}
main{width:100%;max-width:760px;margin:auto;padding:24px 16px;min-height:calc(100vh - 140px)}
h2{font-size:21px;color:var(--navy);margin:0 0 8px}.intro{color:var(--muted);margin:8px 0 18px;line-height:1.8}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}
.subject{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;font:inherit;color:inherit;text-align:center;min-height:120px;justify-content:center}
.subject:hover{border-color:var(--navy);box-shadow:0 4px 12px #244b7020}
.icon{font-size:32px}.desc{display:block;color:var(--muted);font-size:13px;margin-top:4px}
.pill{display:inline-block;background:var(--light);color:var(--navy);border-radius:999px;padding:4px 14px;font-size:14px;font-weight:bold;margin:4px 0}
.progress{margin:14px 0 16px}.between{display:flex;justify-content:space-between;color:var(--navy)}
.bar{height:10px;background:var(--light);border-radius:999px;overflow:hidden;margin:10px 0 6px}.bar>div{height:100%;background:var(--navy);transition:width .25s}
.steps{display:flex;flex-direction:column;gap:10px}.step{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;line-height:1.7}
.step input{appearance:none;width:22px;height:22px;border:2px solid var(--navy);border-radius:4px;flex-shrink:0;cursor:pointer;display:grid;place-content:center;background:#fff;margin:0}
.step input:checked{background:var(--ok);border-color:var(--ok)}.step input:checked:after{content:"✓";color:#fff;font-size:14px;font-weight:bold}
.step.locked{opacity:.55;cursor:not-allowed}.step.locked input{cursor:not-allowed;border-color:#A9B6C4}.step.done{border-color:var(--ok)}
.num{width:26px;height:26px;border-radius:50%;background:var(--light);color:var(--navy);display:grid;place-content:center;font-weight:bold;font-size:13px;flex-shrink:0}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
button.action{background:var(--navy);color:#fff;border:2px solid var(--navy);border-radius:10px;padding:10px 20px;font:inherit;font-weight:bold;cursor:pointer}
button.outline{background:#fff;color:var(--navy)}button:disabled{background:#A9B6C4!important;border-color:#A9B6C4!important;cursor:not-allowed}
.option{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0;cursor:pointer}
.option input{margin-top:4px;accent-color:var(--navy);width:18px;height:18px}.option.selected{border-color:var(--navy);background:var(--bg)}
.q{font-size:17px;color:var(--navy);margin:0 0 12px;line-height:1.7}.error{color:#C0392B;font-size:14px}
.rec{margin-top:18px;border-color:var(--navy);line-height:1.9}.rec p{margin:0 0 14px}
.rec .actions{margin-top:4px}.hint{color:var(--muted);font-size:13px;margin:10px 0 0}
button:focus-visible,.subject:focus-visible{outline:3px solid #F2B705;outline-offset:2px}
footer{text-align:center;padding:18px;color:var(--muted);border-top:1px solid var(--line);font-size:14px}
@media(max-width:420px){.grid{gap:10px}.card{padding:12px}button.action{flex:1}}
</style>
</head>
<body>
<header><h1>مُذاكرتي</h1><p>اختاري مادتك.. واكتشفي طريقة مذاكرتها</p></header>
<main id="app"></main>
<footer>مُذاكرتي | مذاكرة أسهل وفهم أفضل</footer>
<script>
const lughati=[
{id:"reading",icon:"📖",name:"القراءة والفهم",desc:"فهم النص وأفكاره ومفرداته",steps:["اقرئي النص قراءة أولية.","حددي الفكرة العامة.","استخرجي الأفكار الرئيسة والتفاصيل.","افهمي المفردات من السياق.","أجيبي عن أسئلة الفهم والاستيعاب.","لخّصي ما فهمتِه بكلماتك."]},
{id:"literature",icon:"📜",name:"النصوص الأدبية",desc:"تذوق النص وتحليل معانيه وجمالياته",steps:["اقرئي النص قراءة معبّرة.","افهمي معاني المفردات والتراكيب.","حددي الفكرة والعاطفة الرئيسة.","لاحظي الصور الجمالية والأساليب.","استخرجي القيم والأفكار.","أجيبي عن أسئلة تحليل النص."]},
{id:"grammar",icon:"🔤",name:"القواعد اللغوية",desc:"استنتاج القاعدة وتطبيقها على الجمل",steps:["اقرئي الأمثلة ولاحظي الكلمات.","قارني بين الأمثلة.","استنتجي القاعدة.","اقرئي شرح القاعدة وتأكدي من فهمها.","شاهدي أمثلة محلولة.","طبّقي القاعدة على جمل جديدة."]},
{id:"spelling",icon:"✏️",name:"الإملاء",desc:"كتابة الكلمات والجمل وتصحيح الأخطاء",steps:["اقرئي الكلمات أو الأمثلة الإملائية.","لاحظي موضع الظاهرة الإملائية.","استنتجي القاعدة.","افهمي القاعدة من الشرح والأمثلة.","تدربي على كتابة الكلمات والجمل.","راجعي أخطاءك وصححيها."]},
{id:"writing",icon:"✍️",name:"الكتابة والخط",desc:"تنظيم الأفكار وتحسين الكتابة والخط",steps:["افهمي المطلوب ونوع النص.","اجمعي الأفكار ورتبيها.","اكتبي مسودة أولى.","راعي القواعد الإملائية وعلامات الترقيم.","حسّني الصياغة ونظّمي الفقرات.","راجعي النص أو تدربي على كتابة النموذج بخط واضح بحسب طبيعة المهمة."]},
{id:"speaking",icon:"🎧",name:"التحدث والاستماع",desc:"الاستماع بتركيز والتعبير الشفهي بوضوح",steps:["تعرّفي على موضوع الاستماع أو التحدث.","استمعي بتركيز أو اقرئي تعليمات المهمة.","حددي الأفكار والمعلومات الرئيسة.","رتّبي أفكارك قبل التحدث.","تدربي على الحوار أو العرض الشفهي.","قيّمي أداءك من حيث وضوح الصوت وترابط الأفكار."]}
];
const islamic=[
{id:"tawhid",icon:"📖",name:"التوحيد",desc:"فهم المفاهيم وربطها بالأدلة",steps:["اقرئي عنوان الدرس وتعرّفي على موضوعه.","اقرئي الشرح وافهمي المفاهيم والمصطلحات.","حددي الأفكار الرئيسة وما يتصل بها من أقسام أو أنواع.","تعرّفي على الأدلة الشرعية الواردة وافهمي دلالتها.","لخّصي أهم ما تعلمتِه في خريطة أو نقاط.","أجيبي عن أسئلة الدرس وطبّقي ما تعلمتِه."]},
{id:"tafsir",icon:"📖",name:"التفسير",desc:"تدبر الآيات وفهم معانيها",steps:["اقرئي الآيات قراءة صحيحة.","تعرّفي على معاني المفردات.","اقرئي تفسير الآيات وافهمي المعنى الإجمالي.","حددي المعاني والهدايات الرئيسة.","اربطي المعاني بمواقف من الحياة.","أجيبي عن أسئلة الدرس وراجعي فهمك."]},
{id:"hadith",icon:"📖",name:"الحديث",desc:"فهم الحديث وحفظه",steps:["اقرئي الحديث قراءة صحيحة.","تعرّفي على معاني المفردات.","افهمي المعنى الإجمالي للحديث.","تعرّفي على الراوي وما يوضحه الدرس عنه إن وُجد.","استخرجي أهم الفوائد والتوجيهات.","احفظي الحديث إذا كان مطلوباً، ثم أجيبي عن أسئلة الدرس."]},
{id:"fiqh",icon:"📖",name:"الفقه",desc:"فهم الأحكام والتطبيق",steps:["اقرئي عنوان الدرس وتعرّفي على الحكم أو الموضوع.","افهمي المصطلحات والتعريفات.","تعرّفي على الحكم الشرعي ودليله.","رتّبي الشروط والأركان والواجبات أو السنن بحسب موضوع الدرس.","شاهدي أمثلة تطبيقية على الحكم.","أجيبي عن أسئلة الدرس وطبّقي الحكم على مواقف مشابهة."]}
];
const subjects=[
{id:"math",icon:"➗",name:"الرياضيات",desc:"استعد • تأكد • تدرب وحل المسائل",steps:["استعد: ابدئي بتهيئة نفسك للدرس، وتأملي السؤال أو الموقف الافتتاحي وحاولي استحضار معلوماتك السابقة.","تأكد: بعد فهم فكرة الدرس، أجيبي عن أسئلة (تأكد) للتحقق من استيعابك للمفهوم أو المهارة.","تدرب وحل المسائل: انتقلي إلى تدريبات الدرس ومسائله، وابدئي بالحل ثم راجعي إجاباتك وصححي أخطاءك."]},
{id:"sci",icon:"🔬",name:"العلوم",desc:"الفهم والتطبيق",steps:["اطّلعي على المفاهيم العلمية وافهميها.","حددي المصطلحات العلمية المهمة.","شاهدي الرسوم والمخططات.","ارسمي مخططاً أو خريطة مفاهيم.","حلي أسئلة تطبيقية."]},
{id:"isl",icon:"📖",name:"الدراسات الإسلامية",desc:"اختاري الفرع المناسب",categories:islamic},
{id:"soc",icon:"🌍",name:"الاجتماعيات",desc:"القراءة والخرائط",steps:["اقرئي الدرس وتعرّفي على المعلومات والأحداث.","حددي الأماكن والأحداث والمعلومات المهمة.","لخّصي المعلومات.","أنشئي خريطة ذهنية أو جدولاً زمنياً.","راجعي المعلومات واسترجعيها دون كتاب."]},
{id:"ar",icon:"✍️",name:"لغتي الخالدة",desc:"اختاري نوع المهارة",categories:lughati},
{id:"en",icon:"🔤",name:"اللغة الإنجليزية",desc:"المفردات والقواعد",steps:["اقرئي المفردات وتعرّفي على معانيها.","راجعي الكلمات الجديدة وبطاقاتها.","افهمي القاعدة مع مثال.","كوّني جملاً باستخدام الكلمات.","حلي التدريبات."]}
];
const levels=[
{id:"good",title:"نعم، فهمت الدرس جيداً",sub:"أستطيع شرحه والإجابة عن أسئلته.",rec:"أحسنتِ! انتقلي إلى تطبيق ما تعلمتِه وحل تدريبات أكثر تقدماً."},
{id:"part",title:"فهمت جزءاً من الدرس",sub:"أحتاج إلى مراجعة بعض المعلومات.",rec:"راجعي النقاط التي لم تتقنيها، وأعيدي تطبيق خطوات المذاكرة المناسبة للمادة، مثل مراجعة الملخص أو الخريطة الذهنية أو الأمثلة."},
{id:"weak",title:"لم أفهم الدرس جيداً",sub:"أحتاج إلى طريقة أخرى للمذاكرة.",rec:"جربي مصدر شرح آخر أو طريقة أبسط لفهم الدرس، ثم أعيدي خطوات المذاكرة وتحققي من فهمك مرة أخرى."}
];
let view="home",subject=null,category=null,done=0,level=null,shown=null,err=false;
const app=document.getElementById("app");
function reset(){done=0;level=null;shown=null;err=false}
function home(){subject=null;category=null;reset();view="home";render();window.scrollTo(0,0)}
function pick(s){subject=s;category=null;reset();view=s.categories?"categories":"plan";render();window.scrollTo(0,0)}
function pickCategory(c){category=c;reset();view="plan";render();window.scrollTo(0,0)}
function steps(){return category?category.steps:(subject?.steps||[])}
// كل زر يحمل مفتاح إجراء ثابت (act) بدل الاعتماد على نص الزر، حتى يمكن تغيير النص دون تعطيل الزر
function btn(label,act,outline=false,disabled=false){return `<button class="action ${outline?"outline":""}" ${disabled?"disabled":""} data-action="${act}">${label}</button>`}
function where(){return category?`${subject.name} – ${category.name}`:subject.name}
function changeLabel(){return subject&&subject.id==="isl"?"تغيير الفرع":"تغيير المهارة"}
const actions={
 home:home,
 categories:()=>{view="categories";reset();render();window.scrollTo(0,0)},
 eval:()=>{view="eval";render();window.scrollTo(0,0)},
 plan:()=>{view="plan";level=null;shown=null;err=false;render()},
 show:()=>{if(level)shown=level;else err=true;render();const r=document.querySelector(".rec");if(r)r.scrollIntoView({behavior:"smooth",block:"center"})},
 retry:()=>{reset();view="plan";render();window.scrollTo(0,0)}
};
function render(){
let h="";
if(view==="home"){
h=`<h2>ماذا تريدين أن تذاكري اليوم؟</h2><p class="intro">اختاري المادة لتظهر لكِ خطوات مذاكرة مناسبة لها.</p><div class="grid">${subjects.map(s=>`<button class="card subject" data-subject="${s.id}"><span class="icon">${s.icon}</span><strong>${s.name}</strong><span class="desc">${s.desc}</span></button>`).join("")}</div>`;
}
if(view==="categories"){
h=`<h2>اختاري ${subject.id==="isl"?"فرع المادة":"نوع المهارة"}</h2><span class="pill">${subject.icon} ${subject.name} | المرحلة المتوسطة</span><p class="intro">${subject.id==="isl"?"أي فرع تريدين مذاكرته؟":"ما المهارة التي تريدين مذاكرتها؟"}</p><div class="grid">${subject.categories.map(c=>`<button class="card subject" data-category="${c.id}"><span class="icon">${c.icon}</span><strong>${c.name}</strong><span class="desc">${c.desc}</span></button>`).join("")}</div><div class="actions">${btn("العودة للمواد","home",true)}</div>`;
}
if(view==="plan"){
const list=steps(),pct=list.length?Math.round(done/list.length*100):0;
h=`<h2>خطة المذاكرة</h2><span class="pill">${subject.icon} ${subject.name}</span>${category?`<p class="intro"><strong>${category.name}</strong></p>`:""}<p class="intro">اتبعي الخطوات بالترتيب، وضعي علامة صح بعد إنجاز كل خطوة.</p><div class="card progress"><div class="between"><strong>إنجازك في المذاكرة</strong><strong>${pct}%</strong></div><div class="bar"><div style="width:${pct}%"></div></div><span class="desc">${done} من ${list.length} خطوات منجزة</span></div><div class="steps">${list.map((st,i)=>{let checked=i<done,enabled=i===done||i===done-1;return `<label class="card step ${checked?"done":""} ${!enabled?"locked":""}"><input type="checkbox" data-step="${i}" ${checked?"checked":""} ${!enabled?"disabled":""}><span class="num">${i+1}</span><span>${st}</span></label>`}).join("")}</div><div class="actions">${btn("تقييم فهمي للدرس","eval",false,done<list.length)}${category?btn(changeLabel(),"categories",true):""}${btn("العودة للمواد","home",true)}</div>${done<list.length?'<p class="hint">أكملي جميع الخطوات ليتفعّل زر «تقييم فهمي للدرس».</p>':""}`;
}
if(view==="eval"){
h=`<h2>تقييم الفهم</h2><span class="pill">${subject.icon} ${subject.name}</span>${category?`<p class="intro"><strong>${category.name}</strong></p>`:""}<p class="intro">بعد الانتهاء من المذاكرة، اختاري الإجابة التي تصف مستوى فهمك.</p><div class="card"><h3 class="q">هل تستطيعين الآن شرح ما تعلمتِه دون الرجوع إلى الكتاب؟</h3>${levels.map(l=>`<label class="option ${level===l.id?"selected":""}"><input type="radio" name="level" value="${l.id}" ${level===l.id?"checked":""}><span><strong>${l.title}</strong><span class="desc">${l.sub}</span></span></label>`).join("")}${err?'<p class="error">من فضلك اختاري مستوى فهمك أولاً.</p>':""}</div><div class="actions">${btn("عرض التوصية","show")}${btn("العودة للخطة","plan",true)}</div>${shown?`<div class="card rec" aria-live="polite"><p><strong>توصيتك في ${where()}:</strong><br>${levels.find(l=>l.id===shown).rec}</p><div class="actions">${btn("إعادة المحاولة","retry",shown==="good")}${btn("بدء جلسة جديدة","home",shown!=="good")}</div><p class="hint">«إعادة المحاولة» تعيد خطوات المادة نفسها من البداية، و«بدء جلسة جديدة» تعيدك لاختيار مادة.</p></div>`:""}`;
}
app.innerHTML=h;
app.querySelectorAll("[data-subject]").forEach(el=>el.addEventListener("click",()=>pick(subjects.find(s=>s.id===el.dataset.subject))));
app.querySelectorAll("[data-category]").forEach(el=>el.addEventListener("click",()=>pickCategory(subject.categories.find(c=>c.id===el.dataset.category))));
app.querySelectorAll("[data-step]").forEach(el=>el.addEventListener("change",()=>{let i=+el.dataset.step;done=el.checked?i+1:i;render()}));
app.querySelectorAll('input[name="level"]').forEach(el=>el.addEventListener("change",()=>{level=el.value;err=false;render()}));
app.querySelectorAll("button[data-action]").forEach(el=>{const f=actions[el.dataset.action];if(f)el.addEventListener("click",f)});
}
render();
</script>
</body></html>
